# Servidor estático de la PWA.
#
# Lo único que no es obvio aquí es `try_files ... /index.html`, y es lo que hace que el
# enrutador funcione fuera del entorno de desarrollo: desde la fase 11 cada pantalla tiene su
# URL, así que recargar en `/products` pide al servidor un archivo que no existe. Sin esta
# línea, el criterio de salida de la fase —recargar te devuelve donde estabas— sería cierto
# solo con el servidor de Vite.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Los assets llevan hash en el nombre: se pueden cachear para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El service worker y el index, nunca: una copia vieja de cualquiera de los dos deja al
  # comercio con una versión anterior de la caja hasta que alguien borre la caché a mano.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Cualquier otra ruta es una pantalla de la aplicación, no un archivo.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
