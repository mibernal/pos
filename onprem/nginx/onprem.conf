# nginx de la instalación local: sirve la PWA y hace de proxy hacia la API.
#
# Todo pasa por un único origen (https://pos.local o https://<IP>), así que la PWA no
# necesita CORS para hablar con la API y el service worker queda en contexto seguro, que es
# lo que exigen el modo offline, la Web Serial API (báscula, ESC/POS) y la cámara.

# El puerto 80 solo redirige… salvo para bajar el certificado raíz, que hay que poder
# descargar antes de confiar en él.
server {
  listen 80 default_server;
  server_name _;

  location = /ca.crt {
    root /usr/share/nginx/publico;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="pos-dian-ca.crt"';
  }

  location = /instalar-certificado {
    default_type text/html;
    return 200 '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Certificado POS</title><body style="font-family:system-ui;max-width:36rem;margin:2rem auto;padding:0 1rem;line-height:1.5"><h1>Confiar en este POS</h1><p>Este equipo usa un certificado propio del local. Instálalo una vez por dispositivo:</p><p><a href="/ca.crt" style="font-size:1.2rem">Descargar certificado</a></p><ul><li><b>Android:</b> Ajustes → Seguridad → Cifrado y credenciales → Instalar certificado → Certificado de CA.</li><li><b>iPhone/iPad:</b> abre el archivo, Ajustes → Perfil descargado → Instalar; luego Ajustes → General → Información → Ajustes de confianza de certificados → activar.</li><li><b>Windows:</b> doble clic → Instalar certificado → Equipo local → Entidades de certificación raíz de confianza.</li></ul><p>Después entra a <a href="https://$host/">https://$host/</a></p></body>';
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/servidor.crt;
  ssl_certificate_key /etc/nginx/certs/servidor.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  root /usr/share/nginx/html;
  index index.html;

  # Importaciones de catálogo (CSV/XLSX) e imágenes de producto.
  client_max_body_size 50m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "geolocation=(), microphone=()" always;

  # Streams SSE (alertas, panel en vivo): sin búfer, o el navegador no recibe nada hasta
  # que nginx junte 4 KB.
  location ~ ^/api/v1/.*/stream$ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  # Mesas y cocina en tiempo real.
  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  location = /ca.crt {
    root /usr/share/nginx/publico;
    default_type application/x-x509-ca-cert;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Ni el service worker ni el index se cachean: una copia vieja deja la caja en la versión
  # anterior hasta que alguien borre la caché a mano.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
