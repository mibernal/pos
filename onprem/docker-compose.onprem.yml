# Instalación local (on-premise) de pos-dian.
#
# Corre en el mini-PC del comercio. Todo sale de imágenes ya construidas y cargadas con
# `docker load` (ver `scripts/construir-paquete.sh`): aquí no se descarga ni se compila nada,
# así que levanta igual con o sin internet.
#
# Lo maneja `scripts/instalar.sh`; no hace falta tocar este archivo. Las variables salen de
# `/opt/pos-dian/.env`, que genera el instalador con secretos aleatorios.
#
# Ningún puerto de Postgres, Redis, la API ni el worker se publica: lo único que ve la red
# del local es nginx (443, y 80 solo para redirigir y para descargar el certificado raíz).

name: pos-dian

x-node-env: &node-env
  NODE_ENV: production
  DEPLOYMENT_MODE: onprem
  TZ: America/Bogota
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?falta CREDENTIALS_ENCRYPTION_KEY}
  DIAN_PROVIDER: http
  DIAN_HTTP_URL: ${DIAN_HTTP_URL:?falta DIAN_HTTP_URL}
  DIAN_HTTP_API_KEY: ${DIAN_HTTP_API_KEY:?falta DIAN_HTTP_API_KEY}
  DIAN_WEBHOOK_SECRET: ${DIAN_WEBHOOK_SECRET:-}
  NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-NONE}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  STORAGE_PROVIDER: local
  STORAGE_LOCAL_PATH: /app/storage
  ENABLE_TRACING: 'false'
  ENABLE_LOKI: 'false'

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_dian
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      TZ: America/Bogota
    # Ajustado a un mini-PC de 8–16 GB compartido con el resto del stack.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=60
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      # Un apagón a media escritura no puede corromper la base: se dejan fsync y
      # full_page_writes en su valor seguro, explícitos para que nadie los "optimice".
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pos -d pos_dian']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    # AOF: la cola de BullMQ sobrevive a un reinicio. La fuente de verdad del outbox sigue
    # siendo Postgres; esto evita reencolar todo tras cada corte de luz.
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  # Un solo uso por arranque: deja el esquema al día antes de que la API acepte peticiones.
  # Migraciones solo hacia adelante: una actualización nunca ejecuta `down`.
  migrate:
    image: pos-dian/api:${POS_VERSION:?falta POS_VERSION}
    restart: 'no'
    command: ['node', 'dist/shared/infra/db/migrate.js']
    environment:
      <<: *node-env
      DATABASE_URL: postgres://pos_api:${POS_API_PASSWORD}@postgres:5432/pos_dian
      ADMIN_DATABASE_URL: postgres://pos:${POSTGRES_PASSWORD}@postgres:5432/pos_dian
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?falta CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  api:
    image: pos-dian/api:${POS_VERSION}
    restart: unless-stopped
    environment:
      <<: *node-env
      HOST: 0.0.0.0
      PORT: '3000'
      # Un proxy delante (nginx): sin esto todas las tablets serían «la misma IP» para los
      # límites de intentos.
      TRUST_PROXY: '1'
      # La API usa el rol sin BYPASSRLS: el aislamiento lo impone PostgreSQL.
      DATABASE_URL: postgres://pos_api:${POS_API_PASSWORD:?falta POS_API_PASSWORD}@postgres:5432/pos_dian
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - api_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [interna]

  worker:
    image: pos-dian/worker:${POS_VERSION}
    restart: unless-stopped
    environment:
      <<: *node-env
      HOST: 0.0.0.0
      WORKER_PORT: '8080'
      # El worker recorre todos los comercios por diseño (outbox, rollups): rol dueño.
      DATABASE_URL: postgres://pos:${POSTGRES_PASSWORD}@postgres:5432/pos_dian
      ADMIN_DATABASE_URL: postgres://pos:${POSTGRES_PASSWORD}@postgres:5432/pos_dian
      ONPREM_LICENSE_FILE: /licencia/licencia.json
      ONPREM_LICENSE_PUBLIC_KEY: ${ONPREM_LICENSE_PUBLIC_KEY:-}
    volumes:
      - ./licencia:/licencia:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [interna]

  web:
    image: pos-dian/web:${POS_VERSION}
    restart: unless-stopped
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./nginx/onprem.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/servidor.crt:/etc/nginx/certs/servidor.crt:ro
      - ./certs/servidor.key:/etc/nginx/certs/servidor.key:ro
      - ./certs/ca.crt:/usr/share/nginx/publico/ca.crt:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Por el 80: el wget de busybox no siempre trae TLS, y aquí basta con saber que nginx
      # responde con su configuración cargada.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/instalar-certificado || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [interna]

networks:
  interna: {}

volumes:
  postgres_data: {}
  redis_data: {}
  api_storage: {}
