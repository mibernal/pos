name: pos-dian
services:
  postgres:
    image: postgres:16
    container_name: pos-dian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_dian
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U pos -d pos_dian' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pos-dian-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
