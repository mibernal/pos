name: pos-dian
services:
  postgres:
    image: postgres:16
    container_name: pos-dian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_dian
      POSTGRES_USER: pos
      # Contraseña por defecto solo para desarrollo local. En cualquier entorno compartido
      # se define POSTGRES_PASSWORD en el .env y el puerto no se publica al host.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos}
    ports:
      # Se publica en loopback, no en 0.0.0.0: un '5432:5432' pelado deja la base expuesta
      # a toda la red del equipo, y en un portátil en un local eso es la red del comercio.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U pos -d pos_dian' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pos-dian-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
