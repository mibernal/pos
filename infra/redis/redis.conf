# Redis — Configuración de Producción pos-dian
# Persistencia dual: AOF (durabilidad por escritura) + RDB (snapshot para backups)

# ─── AOF: Durabilidad de escrituras ──────────────────────────────────────────
# appendonly yes garantiza que cada escritura en Redis se persiste en el log
# antes de confirmarla al cliente.
appendonly yes

# everysec: sincronizar al disco cada segundo.
# Equilibrio entre rendimiento y durabilidad (máxima pérdida: 1 segundo de datos).
appendfsync everysec

# No pausar fsync durante rewrite del AOF (mejor rendimiento en producción)
no-appendfsync-on-rewrite no

# Auto-comprimir el AOF cuando sea 2x mayor que el tamaño original
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ─── RDB: Snapshots para backup rápido ───────────────────────────────────────
# Guardar un snapshot si hay al menos N cambios en M segundos.
save 900 1      # 1+ cambio en 15 minutos
save 300 10     # 10+ cambios en 5 minutos
save 60 1000    # 1000+ cambios en 1 minuto

# Rechazar escrituras si el RDB snapshot falla (protege integridad)
stop-writes-on-bgsave-error yes

# Comprimir el RDB para ahorrar espacio en disco
rdbcompression yes

# Verificar integridad del RDB al cargar (checksum CRC64)
rdbchecksum yes

# Nombre del archivo de snapshot
dbfilename dump.rdb

# ─── Memoria ──────────────────────────────────────────────────────────────────
# Ajustar según la RAM disponible en el servidor.
# BullMQ + PubSub + Cache: 512mb es suficiente para un SaaS pequeño.
maxmemory 512mb

# Política de evicción: eliminar claves menos usadas cuando se llega al límite.
# allkeys-lru es la opción más segura para BullMQ (no elimina jobs activos
# antes que los expirados).
maxmemory-policy allkeys-lru

# ─── Seguridad ────────────────────────────────────────────────────────────────
# En producción, descomentar y reemplazar con una contraseña fuerte:
# requirepass REDIS_PASSWORD_PLACEHOLDER

# Solo aceptar conexiones locales (Cloud Run o VPC interna)
bind 127.0.0.1

# ─── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
